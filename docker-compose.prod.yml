# ── Production Docker Compose ──────────────────────────────────────────────────
# Uses AWS RDS (Postgres) and AWS S3 instead of local containers.
# Builds all images from source on the EC2 server.

services:
  # ── Message Queue ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Upload Service ───────────────────────────────────────────────────────
  upload-service:
    build:
      context: ./services/upload-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # ── Parser Service ───────────────────────────────────────────────────────
  parser-service:
    build:
      context: ./services/parser-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # ── AI Screener Service ──────────────────────────────────────────────────
  ai-screener-service:
    build:
      context: ./services/ai-screener-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # ── Dashboard (React SPA served by Nginx) ────────────────────────────────
  dashboard-service:
    build:
      context: ./services/dashboard-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - upload-service
      - ai-screener-service
